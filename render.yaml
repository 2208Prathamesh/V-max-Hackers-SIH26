services:
  - type: web
    name: weathergpt-backend
    env: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: REDIS_ENABLED
        value: false
      - key: NEWS_INDIA_QUERY
        value: India weather OR monsoon OR flood OR cyclone OR cloudburst OR IMD
      - key: NEWS_GLOBAL_QUERY
        value: extreme weather OR cyclone OR hurricane OR typhoon OR heatwave OR flood disaster OR climate emergency
      - key: NEWS_TRENDING_TOPICS
        value: monsoon,flood,cyclone,cloudburst,heatwave,hurricane,typhoon,landslide,drought,wildfire,storm
