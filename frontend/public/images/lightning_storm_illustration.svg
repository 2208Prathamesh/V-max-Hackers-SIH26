<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="stormSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="40%" stop-color="#312E81" />
      <stop offset="70%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Storm Sky -->
  <rect width="400" height="300" fill="url(#stormSky)" />

  <!-- Thunderclouds -->
  <path d="M-20,70 Q40,20 100,55 T220,35 T320,50 T420,30 L420,130 L-20,130 Z" fill="#0F172A" opacity="0.9" />
  <path d="M30,85 Q110,40 180,75 T300,60 T420,70 L420,140 L30,140 Z" fill="#1E1B4B" opacity="0.8" />

  <!-- Lightning Glow Aura in Clouds -->
  <circle cx="210" cy="80" r="70" fill="#E0E7FF" opacity="0.25" filter="url(#boltGlow)" />

  <!-- Main Branching Lightning Bolt -->
  <g filter="url(#boltGlow)">
    <polyline points="210,60 195,100 215,130 180,175 195,190 170,240 175,270" stroke="#C7D2FE" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
    <polyline points="210,60 195,100 215,130 180,175 195,190 170,240 175,270" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Branch 1 -->
    <polyline points="215,130 240,150 235,180 250,205" stroke="#A5B4FC" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <polyline points="215,130 240,150 235,180 250,205" stroke="#FFFFFF" stroke-width="1" fill="none" stroke-linecap="round" />

    <!-- Branch 2 -->
    <polyline points="180,175 155,195 160,225" stroke="#A5B4FC" stroke-width="2" fill="none" stroke-linecap="round" />
  </g>

  <!-- Dark Distant Mountains in Flash -->
  <polygon points="0,270 90,190 200,270" fill="#1E1B4B" />
  <polygon points="140,280 260,180 370,280" fill="#312E81" opacity="0.8" />
  <polygon points="270,285 350,210 420,285" fill="#1E1B4B" />

  <!-- Foreground Silhouette Ground -->
  <path d="M0,260 Q120,240 240,255 T400,250 L400,300 L0,300 Z" fill="#030712" />
</svg>
