<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="trainSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="viaductStone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <radialGradient id="steamPuff" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#CBD5E1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="300" fill="url(#trainSky)" />

  <!-- Distant Rolling Hills -->
  <path d="M0,170 Q100,140 200,165 T400,160 L400,220 L0,220 Z" fill="#64748B" opacity="0.4" />

  <!-- Historic Stone Viaduct Arches -->
  <!-- Main Viaduct Deck -->
  <rect x="0" y="160" width="400" height="15" fill="url(#viaductStone)" />
  <line x1="0" y1="160" x2="400" y2="160" stroke="#0F172A" stroke-width="2" />

  <!-- Viaduct Arches -->
  <!-- Arch 1 -->
  <rect x="10" y="175" width="20" height="125" fill="url(#viaductStone)" />
  <path d="M30,220 Q65,175 100,220 L100,300 L30,300 Z" fill="#0F172A" />
  <!-- Arch 2 -->
  <rect x="100" y="175" width="20" height="125" fill="url(#viaductStone)" />
  <path d="M120,220 Q155,175 190,220 L190,300 L120,300 Z" fill="#0F172A" />
  <!-- Arch 3 -->
  <rect x="190" y="175" width="20" height="125" fill="url(#viaductStone)" />
  <path d="M210,220 Q245,175 280,220 L280,300 L210,300 Z" fill="#0F172A" />
  <!-- Arch 4 -->
  <rect x="280" y="175" width="20" height="125" fill="url(#viaductStone)" />
  <path d="M300,220 Q335,175 370,220 L370,300 L300,300 Z" fill="#0F172A" />
  <rect x="370" y="175" width="30" height="125" fill="url(#viaductStone)" />

  <!-- Viaduct Arch Surrounds (Stone masonry details) -->
  <path d="M30,220 Q65,175 100,220" stroke="#64748B" stroke-width="6" fill="none" />
  <path d="M120,220 Q155,175 190,220" stroke="#64748B" stroke-width="6" fill="none" />
  <path d="M210,220 Q245,175 280,220" stroke="#64748B" stroke-width="6" fill="none" />
  <path d="M300,220 Q335,175 370,220" stroke="#64748B" stroke-width="6" fill="none" />

  <!-- Steam Locomotive Train -->
  <!-- Steam Cloud Plumes billowing back -->
  <circle cx="210" cy="110" r="16" fill="url(#steamPuff)" />
  <circle cx="240" cy="95" r="22" fill="url(#steamPuff)" />
  <circle cx="280" cy="80" r="30" fill="url(#steamPuff)" />
  <circle cx="330" cy="65" r="38" fill="url(#steamPuff)" />
  <circle cx="380" cy="55" r="45" fill="url(#steamPuff)" />

  <!-- Train Coaches -->
  <rect x="240" y="140" width="70" height="18" fill="#1E293B" rx="2" />
  <!-- Coach Windows -->
  <rect x="245" y="144" width="8" height="6" fill="#FDE047" rx="1" />
  <rect x="258" y="144" width="8" height="6" fill="#FDE047" rx="1" />
  <rect x="271" y="144" width="8" height="6" fill="#FDE047" rx="1" />
  <rect x="284" y="144" width="8" height="6" fill="#FDE047" rx="1" />
  <rect x="297" y="144" width="8" height="6" fill="#FDE047" rx="1" />

  <!-- Tender (Coal Car) -->
  <rect x="205" y="142" width="30" height="16" fill="#0F172A" rx="2" />

  <!-- Steam Engine Cab -->
  <rect x="175" y="132" width="28" height="26" fill="#0F172A" rx="2" />
  <rect x="180" y="136" width="8" height="8" fill="#FEF08A" rx="1" />

  <!-- Engine Boiler -->
  <rect x="120" y="138" width="55" height="20" fill="#1E293B" rx="4" />

  <!-- Smokestack / Chimney -->
  <polygon points="128,138 134,138 136,122 126,122" fill="#0F172A" />
  <!-- Steam Dome -->
  <ellipse cx="152" cy="136" rx="5" ry="4" fill="#EAB308" />

  <!-- Cowcatcher / Front Grill -->
  <polygon points="120,158 110,158 120,146" fill="#0F172A" />

  <!-- Train Headlight Glow -->
  <circle cx="114" cy="147" r="4" fill="#FEF08A" />
  <polygon points="112,147 60,135 60,165" fill="#FEF08A" opacity="0.25" />

  <!-- Engine Wheels -->
  <circle cx="132" cy="158" r="6" fill="#94A3B8" stroke="#0F172A" stroke-width="2" />
  <circle cx="148" cy="158" r="6" fill="#94A3B8" stroke="#0F172A" stroke-width="2" />
  <circle cx="164" cy="158" r="6" fill="#94A3B8" stroke="#0F172A" stroke-width="2" />
  <circle cx="188" cy="158" r="4" fill="#94A3B8" stroke="#0F172A" stroke-width="2" />
</svg>
