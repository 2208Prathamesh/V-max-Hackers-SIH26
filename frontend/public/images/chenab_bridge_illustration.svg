<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="chenabSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#BAE6FD" />
      <stop offset="100%" stop-color="#F0F9FF" />
    </linearGradient>
    <linearGradient id="chenabMountainFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="chenabGorge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="bridgeSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="300" fill="url(#chenabSky)" />

  <!-- Distant Himalayan Peaks with Snow -->
  <polygon points="60,110 120,40 180,110" fill="url(#chenabMountainFar)" />
  <polygon points="120,40 100,75 140,75" fill="#FFFFFF" opacity="0.95" />

  <polygon points="160,120 230,30 300,120" fill="url(#chenabMountainFar)" />
  <polygon points="230,30 205,70 255,70" fill="#FFFFFF" opacity="0.95" />

  <polygon points="280,130 340,55 400,130" fill="url(#chenabMountainFar)" />
  <polygon points="340,55 320,85 365,85" fill="#FFFFFF" opacity="0.95" />

  <!-- Midground Mountains / Valley Slopes -->
  <path d="M-20,200 L80,110 L200,200 Z" fill="#334155" />
  <path d="M220,200 L320,115 L420,200 Z" fill="#334155" />

  <!-- Deep River Gorge Slopes -->
  <polygon points="0,150 120,150 70,300 0,300" fill="url(#chenabGorge)" />
  <polygon points="400,150 280,150 330,300 400,300" fill="url(#chenabGorge)" />

  <!-- World's Highest Arch Railway Bridge -->
  <!-- Horizontal Railway Deck -->
  <rect x="50" y="146" width="300" height="7" fill="url(#bridgeSteel)" rx="2" />
  <line x1="50" y1="145" x2="350" y2="145" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Steel Arch Ribs -->
  <path d="M100,240 Q200,135 300,240" stroke="#CBD5E1" stroke-width="6" fill="none" />
  <path d="M110,240 Q200,150 290,240" stroke="#64748B" stroke-width="4" fill="none" />

  <!-- Vertical Bridge Pylons & Truss Bracing -->
  <line x1="140" y1="153" x2="140" y2="205" stroke="#94A3B8" stroke-width="2" />
  <line x1="170" y1="153" x2="170" y2="175" stroke="#94A3B8" stroke-width="2" />
  <line x1="200" y1="153" x2="200" y2="168" stroke="#94A3B8" stroke-width="2" />
  <line x1="230" y1="153" x2="230" y2="175" stroke="#94A3B8" stroke-width="2" />
  <line x1="260" y1="153" x2="260" y2="205" stroke="#94A3B8" stroke-width="2" />

  <!-- Sea of Clouds Swirling Under Bridge Deck -->
  <path d="M-10,230 Q30,205 80,225 T180,210 T280,225 T380,215 T420,230 L420,300 L-10,300 Z" fill="#FFFFFF" opacity="0.8" />
  <path d="M-20,245 Q50,225 120,240 T240,230 T340,242 T420,238 L420,300 L-20,300 Z" fill="#F1F5F9" opacity="0.9" />
  <path d="M20,265 Q90,250 160,260 T300,255 T410,265 L410,300 L20,300 Z" fill="#FFFFFF" opacity="0.95" />
</svg>
