<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B3561" />
      <stop offset="35%" stop-color="#6B5B95" />
      <stop offset="65%" stop-color="#FEB236" />
      <stop offset="85%" stop-color="#FF7B54" />
      <stop offset="100%" stop-color="#E85A4F" />
    </linearGradient>
    <linearGradient id="seaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C5282" />
      <stop offset="50%" stop-color="#1A365D" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="cliffGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="beaconBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="300" fill="url(#skyGrad)" />

  <!-- Setting Sun -->
  <circle cx="100" cy="190" r="45" fill="#FFEAA7" opacity="0.9" />

  <!-- Distant Clouds -->
  <path d="M0,170 Q40,160 90,165 T180,168 T260,162 T340,168 T400,165 L400,195 L0,195 Z" fill="#D97706" opacity="0.45" />
  <path d="M0,180 Q60,175 120,180 T240,176 T360,180 T400,178 L400,200 L0,200 Z" fill="#9A3412" opacity="0.4" />

  <!-- Sea -->
  <rect y="195" width="400" height="105" fill="url(#seaGrad)" />

  <!-- Water Reflections -->
  <ellipse cx="100" cy="205" rx="35" ry="3" fill="#FDE047" opacity="0.6" />
  <ellipse cx="100" cy="214" rx="28" ry="2.5" fill="#FDE047" opacity="0.5" />
  <ellipse cx="100" cy="225" rx="20" ry="2" fill="#FDE047" opacity="0.4" />
  <ellipse cx="100" cy="238" rx="14" ry="1.5" fill="#FDE047" opacity="0.3" />

  <!-- Wave Crests -->
  <path d="M0,230 Q30,222 60,230 T120,230 T180,230" stroke="#93C5FD" stroke-width="2.5" fill="none" opacity="0.5" />
  <path d="M140,250 Q170,242 200,250 T260,250" stroke="#93C5FD" stroke-width="2" fill="none" opacity="0.4" />
  <path d="M40,270 Q80,260 120,270 T200,270" stroke="#93C5FD" stroke-width="2.5" fill="none" opacity="0.5" />

  <!-- Coastal Cliff -->
  <path d="M220,300 L250,210 L265,160 L280,120 L300,125 L340,300 Z" fill="url(#cliffGrad)" />
  <path d="M250,210 L285,165 L320,300 Z" fill="#1E293B" opacity="0.6" />
  <path d="M220,300 L245,240 L275,300 Z" fill="#0F172A" />

  <!-- Crashing Sea Foam at Base of Cliff -->
  <path d="M210,290 Q225,270 240,285 Q255,275 270,295 Z" fill="#FFFFFF" opacity="0.85" />
  <path d="M230,295 Q245,280 260,298 Z" fill="#E2E8F0" opacity="0.9" />

  <!-- Lighthouse Body -->
  <polygon points="280,120 296,120 293,52 283,52" fill="#F8FAFC" stroke="#334155" stroke-width="1.5" />
  <!-- Red Stripe on Lighthouse -->
  <polygon points="282.2,85 293.8,85 292.5,70 282.6,70" fill="#DC2626" />
  <!-- Lantern Room -->
  <rect x="281" y="42" width="14" height="10" fill="#FEF08A" stroke="#1E293B" stroke-width="1.5" />
  <!-- Dome Roof -->
  <path d="M280,42 Q288,32 296,42 Z" fill="#1E293B" />
  <circle cx="288" cy="32" r="2" fill="#1E293B" />
  <!-- Gallery Railing -->
  <line x1="279" y1="52" x2="297" y2="52" stroke="#1E293B" stroke-width="2" />

  <!-- Lighthouse Beacon Light Beam -->
  <polygon points="288,47 0,80 0,160" fill="url(#beaconBeam)" opacity="0.75" />
</svg>
