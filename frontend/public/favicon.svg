<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Sun Glow and Gradient -->
    <linearGradient id="dashboardSunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Cloud Gradient matching Sidebar.jsx & Dashboard -->
    <linearGradient id="dashboardCloudGrad" x1="10" y1="5" x2="55" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <filter id="sunGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Golden Glowing Sun behind cloud -->
  <g filter="url(#sunGlow)">
    <!-- Sun Core -->
    <circle cx="44" cy="20" r="13" fill="url(#dashboardSunGrad)" />
    <!-- Sun Rays -->
    <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round">
      <line x1="44" y1="4" x2="44" y2="1" />
      <line x1="56" y1="8" x2="58.5" y2="5.5" />
      <line x1="61" y1="20" x2="64" y2="20" />
      <line x1="56" y1="32" x2="58.5" y2="34.5" />
      <line x1="32" y1="8" x2="29.5" y2="5.5" />
      <line x1="44" y1="36" x2="44" y2="39" />
    </g>
    <!-- Inner bright highlight -->
    <circle cx="44" cy="20" r="8.5" fill="#FEF08A" opacity="0.95" />
  </g>

  <!-- 3D Puffy Cloud from Dashboard (Sidebar / LoginPage icon) -->
  <g filter="url(#cloudShadow)">
    <path
      d="M48 38H16C8.82 38 3 32.18 3 25C3 18.23 8.16 12.67 14.85 12.06C17.65 5.16 24.47 0.5 32.5 0.5C42.06 0.5 49.98 7.37 51.64 16.48C57.48 17.58 61.5 22.68 61.5 28.5C61.5 33.75 57.25 38 52 38H48Z"
      transform="translate(1, 14) scale(0.97)"
      fill="url(#dashboardCloudGrad)"
    />
    <!-- Top specular light highlight -->
    <path
      d="M17 38C10.5 38 5.5 33 5.5 26.5C5.5 20.5 9.8 15.5 15.8 15C18.5 8.5 24.8 4 32.5 4C41 4 48 10 49.8 18"
      transform="translate(1, 14) scale(0.97)"
      stroke="#FFFFFF"
      stroke-width="1.5"
      stroke-linecap="round"
      opacity="0.5"
      fill="none"
    />
  </g>
</svg>